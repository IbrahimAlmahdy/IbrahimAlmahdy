
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate all-time commit contributions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = "IbrahimAlmahdy"
          API_URL = "https://api.github.com/graphql"

          def graphql(query, variables=None):
              payload = json.dumps({
                  "query": query,
                  "variables": variables or {}
              }).encode("utf-8")

              request = urllib.request.Request(
                  API_URL,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "GitHub-Profile-Stats"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if "errors" in result:
                  raise RuntimeError(json.dumps(result["errors"]))

              if "data" not in result or result["data"] is None:
                  raise RuntimeError("GitHub returned no GraphQL data")

              return result["data"]

          years_query = """
          query($login: String!) {
            user(login: $login) {
              login
              contributionYears
            }
          }
          """

          user = graphql(
              years_query,
              {"login": USERNAME}
          )["user"]

          if user is None:
              raise RuntimeError(f"GitHub user {USERNAME} was not found")

          years = user["contributionYears"]

          total_commits = 0

          commits_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
              }
            }
          }
          """

          for year in years:
              start = f"{year}-01-01T00:00:00Z"

              if year == datetime.now(timezone.utc).year:
                  end = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              else:
                  end = f"{year + 1}-01-01T00:00:00Z"

              data = graphql(
                  commits_query,
                  {
                      "login": USERNAME,
                      "from": start,
                      "to": end
                  }
              )

              count = data["user"]["contributionsCollection"]["totalCommitContributions"]

              total_commits += count

              print(f"{year}: {count} commit contributions")

          print(f"All-time commit contributions: {total_commits}")

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"COMMIT_COUNT={total_commits}\n")
          PY

      - name: Update README
        env:
          COMMIT_COUNT: ${{ env.COMMIT_COUNT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          start = "<!-- TOTAL_COMMITS_START -->"
          end = "<!-- TOTAL_COMMITS_END -->"

          if start not in content or end not in content:
              raise SystemExit("README markers are missing")

          count = os.environ["COMMIT_COUNT"]

          section = (
              f"{start}\n"
              f"**Total Commits:** {count}\n"
              f"{end}"
          )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          path.write_text(
              before + section + after,
              encoding="utf-8"
          )

          print(f"README updated: {count}")
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
          else
            git commit -m "chore: update GitHub commit statistics"
            git push
          fi
