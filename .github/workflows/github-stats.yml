
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate all-time commit contributions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = "IbrahimAlmahdy"
          API_URL = "https://api.github.com/graphql"

          def graphql(query, variables=None):
              payload = json.dumps({
                  "query": query,
                  "variables": variables or {}
              }).encode("utf-8")

              request = urllib.request.Request(
                  API_URL,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "GitHub-Profile-Stats"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if "errors" in result:
                  raise RuntimeError(json.dumps(result["errors"]))

              if not result.get("data"):
                  raise RuntimeError("GitHub returned no data")

              return result["data"]

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
              }
            }
          }
          """

          now = datetime.now(timezone.utc)
          total_commits = 0

          for year in range(2008, now.year + 1):
              start = f"{year}-01-01T00:00:00Z"

              if year == now.year:
                  end = now.isoformat().replace("+00:00", "Z")
              else:
                  end = f"{year + 1}-01-01T00:00:00Z"

              data = graphql(
                  query,
                  {
                      "login": USERNAME,
                      "from": start,
                      "to": end
                  }
              )

              user = data.get("user")

              if user is None:
                  raise RuntimeError("GitHub user was not found")

              count = user["contributionsCollection"]["totalCommitContributions"]

              total_commits += count
              print(f"{year}: {count} commit contributions")

          print(f"Total commit contributions: {total_commits}")

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"COMMIT_COUNT={total_commits}\n")
          PY

      - name: Update README
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          start = "<!-- TOTAL_COMMITS_START -->"
          end = "<!-- TOTAL_COMMITS_END -->"

          if start not in content or end not in content:
              raise SystemExit("README markers are missing")

          count = os.environ["COMMIT_COUNT"]

          badge = (
              '<img src="https://img.shields.io/badge/'
              f'TOTAL%20COMMITS-{count}-0D1117'
              '?style=for-the-badge&logo=github'
              '&logoColor=58A6FF&labelColor=161B22" '
              'alt="Total Commits"/>'
          )

          section = (
              f"{start}\n"
              f"{badge}\n"
              f"{end}"
          )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          path.write_text(
              before + section + after,
              encoding="utf-8"
          )

          print(f"README badge updated: {count}")
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
          else
            git commit -m "chore: update GitHub commit statistics"
            git push
          fi
