
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate GitHub commits
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS -G \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "q=author:IbrahimAlmahdy" \
            --data-urlencode "per_page=1" \
            https://api.github.com/search/commits)

          echo "$RESPONSE"

          COUNT=$(echo "$RESPONSE" | jq -r '.total_count // empty')

          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
            echo "Failed to retrieve commit count"
            exit 1
          fi

          echo "COMMIT_COUNT=$COUNT" >> "$GITHUB_ENV"

          echo "Total commits found: $COUNT"

      - name: Update README
        env:
          COMMIT_COUNT: ${{ env.COMMIT_COUNT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          start = "<!-- TOTAL_COMMITS_START -->"
          end = "<!-- TOTAL_COMMITS_END -->"

          if start not in content or end not in content:
              raise SystemExit("README markers are missing")

          count = os.environ["COMMIT_COUNT"]

          section = (
              f"{start}\n"
              f"**Total Commits:** {count}\n"
              f"{end}"
          )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          updated_content = before + section + after

          path.write_text(updated_content, encoding="utf-8")

          print(f"README updated with {count} commits")

          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit"
          else
            git commit -m "chore: update GitHub commit statistics"
            git push
          fi
